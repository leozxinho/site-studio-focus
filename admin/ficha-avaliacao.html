<!DOCTYPE html>
<html lang="pt-BR">

<script src="https://unpkg.com/lucide@latest"></script>

<script>(function(){var t=localStorage.getItem('sf-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="admin.css">
<style>
/* ─── Tabs ─── */
.tab-btn { transition: all .2s; }
.tab-btn.active { background: var(--pu); color:#fff; border-color:var(--pu); }
.tab-panel { display:none; }
.tab-panel.active { display:block; animation: fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

/* ─── Form ─── */
.fg { margin-bottom: 14px; }
.fl { display:block; font-size:10px; font-weight:700; text-transform:uppercase;
      letter-spacing:.06em; color:var(--mt); margin-bottom:4px; }
input[type=number], input[type=text], input[type=date], input[type=file], select, textarea {
  background:var(--s2); border:1px solid var(--bd2); border-radius:8px;
  padding:7px 11px; color:var(--tx); font-size:13px; width:100%; outline:none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus {
  border-color:var(--pu); box-shadow:0 0 0 2px var(--pu-glow);
}
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.grid4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; }
.sh { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
      color:var(--mt); border-bottom:1px solid var(--bd2); padding-bottom:8px; margin-bottom:16px; }

/* ─── PAR-Q ─── */
.parq-item { background:var(--s2); border:1px solid var(--bd); border-radius:12px; padding:16px; }
.parq-obs { display:none; margin-top:10px; }
.parq-obs.show { display:block; }
.radio-row { display:flex; gap:20px; margin-top:8px; }
.radio-row label { display:flex; align-items:center; gap:6px; font-size:13px;
                   color:var(--tx); cursor:pointer; text-transform:none; letter-spacing:0; font-weight:500; }

/* ─── SVG body ─── */
.sv-region { transition: fill .25s, filter .25s; }
.sv-region.filled { filter: drop-shadow(0 0 5px var(--pu-glow)); }
.sv-val { font-size:8.5px; font-weight:700; font-family:'DM Sans',sans-serif; fill:#fff; pointer-events:none; }
.sv-lbl { font-size:8px; font-weight:600; font-family:'DM Sans',sans-serif; fill:var(--mt); pointer-events:none; }

/* ─── Calc cards ─── */
.calc-box { background:var(--s2); border:1px solid var(--bd2); border-radius:12px; padding:16px; }
.badge { display:inline-block; padding:3px 12px; border-radius:999px; font-size:11px; font-weight:800; }
.badge-low    { background:#10b98120; color:#10b981; }
.badge-ok     { background:#0066ff20; color:var(--pu2); }
.badge-warn   { background:#f9731620; color:#f97316; }
.badge-danger { background:#ef444420; color:#ef4444; }

/* ─── Method buttons ─── */
.met-btn { padding:8px 18px; border-radius:8px; font-weight:700; font-size:13px;
           border:1px solid var(--bd2); cursor:pointer; transition:all .2s; color:var(--mt); }
.met-btn.active { background:var(--pu); color:#fff; border-color:var(--pu); }

/* ─── Zone rows ─── */
.zone-row { display:flex; align-items:center; gap:8px; padding:6px 10px;
            background:var(--s3); border-radius:8px; font-size:12px; }
.zone-color { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:var(--s3); border-radius:6px; }

/* ─── Print / PDF ─── */
@media print {
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  html, body { background:#030d1a !important; height:auto !important; overflow:visible !important; }
  header, #tab-nav, #btn-sv-ficha, #btn-pdf, #toast-f,
  button, .met-btn, .tab-btn { display:none !important; }
  #tab-content { overflow:visible !important; height:auto !important; padding:0 !important; background:transparent !important; }
  .tab-panel { display:none !important; }
  #tab-9 { display:block !important; }
  @page { margin: 0; size: A4; }
}
</style>
</head>
<body style="height:100vh;overflow:hidden;display:flex;flex-direction:column">

<!-- HEADER -->

    <strong style="color:var(--tx);font-size:15px">Ficha de Avaliação Física</strong>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:6px">
      <span class="fl" style="margin:0;white-space:nowrap">Aluno:</span>
      <select id="ficha-aluno-id" onchange="carregarFicha()" style="min-width:180px;padding:5px 10px">
        <option value="">Selecione...</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span class="fl" style="margin:0">Data:</span>
      <input type="date" id="ficha-data" style="min-width:140px;padding:5px 10px">
    </div>
    <button onclick="salvarFicha()" id="btn-sv-ficha"
            style="display:flex;align-items:center;gap:6px;padding:7px 18px;border-radius:8px;
                   background:var(--pu);color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer">
      <i data-lucide="save" style="width:15px;height:15px"></i> Salvar Ficha
    </button>
    <button onclick="exportarPDF()" id="btn-pdf"
            style="display:flex;align-items:center;gap:6px;padding:7px 18px;border-radius:8px;
                   background:var(--s3);color:var(--tx);font-weight:700;font-size:13px;border:1px solid var(--bd2);cursor:pointer">
      <i data-lucide="file-down" style="width:15px;height:15px"></i> Exportar PDF
    </button>
  </div>
</header>

<!-- TAB NAV -->
<nav id="tab-nav" style="flex-shrink:0;display:flex;gap:4px;padding:8px 20px;
     border-bottom:1px solid var(--bd2);background:var(--s1);overflow-x:auto">
</nav>

<!-- CONTENT -->
<main id="tab-content" style="flex:1;overflow-y:auto;padding:24px;background:var(--bg)">
</main>

<!-- Toast -->
<div id="toast-f" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);
     z-index:500;padding:10px 22px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;
     box-shadow:0 4px 20px rgba(0,0,0,.4);opacity:0;transition:all .3s;pointer-events:none"></div>

<script>

document.addEventListener('DOMContentLoaded', () => {

// ═══════════════════════════ TABS ═══════════════════════════
const TABS = [
  { id:1, label:'1. Anamnese' },    { id:2, label:'2. PAR-Q' },
  { id:3, label:'3. Medidas' },     { id:4, label:'4. Composição' },
  { id:5, label:'5. IMC / IAC' },   { id:6, label:'6. RCQ' },
  { id:7, label:'7. Postural' },    { id:8, label:'8. Cardio' },
  { id:9, label:'Resultado Visual' },
];
let activeTab = 1;
function buildTabs() {
  const nav = document.getElementById('tab-nav');
  nav.innerHTML = TABS.map(t => `<button onclick="mudarAba(${t.id})" id="tab-btn-${t.id}"
    class="tab-btn${t.id===1?' active':''}"
    style="white-space:nowrap;padding:7px 14px;border-radius:8px;border:1px solid var(--bd2);
           font-size:12px;font-weight:700;cursor:pointer;${t.id===1?'':'color:var(--mt)'}"
    >${t.label}</button>`).join('');
  renderAllPanels();
}
function mudarAba(n) {
  activeTab = n;
  TABS.forEach(t => {
    const b = document.getElementById(`tab-btn-${t.id}`);
    if (t.id===n) { b.classList.add('active'); b.style.color=''; }
    else { b.classList.remove('active'); b.style.color='var(--mt)'; }
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${n}`)?.classList.add('active');
}

// ═══════════════════════════ RENDER PANELS ═══════════════════════════
function renderAllPanels() {
  const c = document.getElementById('tab-content');
  c.innerHTML = `
    ${panel1()}${panel2()}${panel3()}${panel4()}${panel5()}${panel6()}${panel7()}${panel8()}${panel9()}
  `;
  buildParqQuestions();
  atualizarCamposDobras();
  atualizarCamposCardio();
  if (window.lucide) lucide.createIcons();
}

// ─── TAB 2: PAR-Q ─────────────────────────────────────────────────────
const PARQ_QS = [
  'Algum médico já disse que você possui algum problema de coração e que só deveria realizar atividade física supervisionada?',

];
function panel2() { return `
<div id="tab-2" class="tab-panel" style="max-width:760px;margin:0 auto">
  <div class="sh">PAR-Q - Questionário de Prontidão para Atividade Física</div>
  <p style="font-size:12px;color:var(--mt);margin-bottom:16px">Qualquer resposta "Sim" pode indicar necessidade de avaliação médica antes de iniciar exercícios.</p>
  <div id="parq-list" style="display:flex;flex-direction:column;gap:10px"></div>
</div>`; }

function buildParqQuestions() {
  const el = document.getElementById('parq-list');
  if (!el) return;
  el.innerHTML = PARQ_QS.map((q, i) => `
  <div class="parq-item">
    <p style="font-size:13px;color:var(--tx);font-weight:500">${i+1}. ${q}</p>
    <div class="radio-row">
      <label><input type="radio" name="parq-${i}" value="Não" checked onchange="parqToggle(${i})"> Não</label>
      <label><input type="radio" name="parq-${i}" value="Sim" onchange="parqToggle(${i})"> Sim</label>
    </div>
    <div class="parq-obs" id="parq-obs-${i}">
      <label class="fl">Observação</label>
      <input type="text" id="parq-txt-${i}" placeholder="Descreva...">
    </div>
  </div>`).join('');
}
function parqToggle(i) {
  const val = document.querySelector(`input[name="parq-${i}"]:checked`)?.value;
  document.getElementById(`parq-obs-${i}`)?.classList.toggle('show', val === 'Sim');
}

function atualizarCamposDobras() {
  const proto = document.getElementById('cc-protocolo')?.value || 'JP7';

function calcCompo() {
  const sexo = document.getElementById('cc-sexo')?.value;
  const idade = parseFloat(document.getElementById('cc-idade')?.value)||0;
  const peso = parseFloat(document.getElementById('cc-peso')?.value)||0;
  const proto = document.getElementById('cc-protocolo')?.value || 'JP7';
  if (!sexo) return;
  const conf = DOBRAS_DEF[proto];
  const fields = conf?.all || conf?.[sexo] || conf?.['M'];
  if (!fields) return;
  const vals = fields.map(f => parseFloat(document.getElementById(`db-${f}`)?.value)||0);
  if (vals.every(v=>v===0)) return;
  let pct = calcDobras(proto, vals, sexo, idade);
  if (pct === null || isNaN(pct)) return;
  pct = Math.max(3, Math.min(60, pct));
  const res = document.getElementById('cc-resultado');
  res.style.display = 'block';
  document.getElementById('cc-pct').textContent = pct.toFixed(1) + '%';
  if (peso > 0) {
    const mg = peso * pct / 100;
    document.getElementById('cc-mg').textContent  = mg.toFixed(1) + ' kg';
    document.getElementById('cc-mm').textContent  = (peso - mg).toFixed(1) + ' kg';
  } else {
    document.getElementById('cc-mg').textContent = '-';
    document.getElementById('cc-mm').textContent = '-';
  }
}

function calcDobras(proto, vals, sexo, idade) {
  const S = vals.reduce((a,b)=>a+b,0);
  const log = Math.log10;
  let D, pct;
  switch(proto) {
    case 'JP7':
      D = sexo==='M' ? 1.112 - 0.00043499*S + 0.00000055*S*S - 0.00028826*idade
                     : 1.097 - 0.00046971*S + 0.00000056*S*S - 0.00012828*idade;
      return (495/D) - 450;
    case 'JP3':
      D = sexo==='M' ? 1.10938 - 0.0008267*S + 0.0000016*S*S - 0.0002574*idade
                     : 1.0994921 - 0.0009929*S + 0.0000023*S*S - 0.0001392*idade;
      return (495/D) - 450;
    case 'PT4':
      D = sexo==='M' ? 1.10726863 - 0.00081201*S + 0.00000212*S*S - 0.00041761*idade
                     : 1.0941625  - 0.00082643*S + 0.0000026*S*S  - 0.0002117*idade;
      return (495/D) - 450;
    case 'GD3_85':
      if (S<=0) return null;
      D = sexo==='M' ? 1.17136 - 0.06706*log(S) : 1.14580 - 0.06217*log(S);
      return (495/D) - 450;
    case 'GD3_94':
      D = sexo==='M' ? 1.10938 - 0.0008267*S + 0.0000016*S*S - 0.0002574*idade
                     : 1.09902 - 0.0009929*S + 0.0000023*S*S - 0.0001392*idade;
      return (495/D) - 450;
    case 'FK4':
      return S * 0.153 + 5.783;
    case 'DR4':
      if (S<=0) return null;
      const lS = log(S);
      if (sexo==='M') {
        if (idade<27)  D=1.1620-0.0630*lS; else if(idade<40) D=1.1631-0.0632*lS;
        else if(idade<50) D=1.1422-0.0544*lS; else D=1.1715-0.0779*lS;
      } else {
        if (idade<27)  D=1.1549-0.0678*lS; else if(idade<40) D=1.1423-0.0632*lS;
        else if(idade<50) D=1.1333-0.0612*lS; else D=1.1339-0.0645*lS;
      }
      return (495/D) - 450;
    case 'LN':
      const cintura=vals[0]||0;
      return sexo==='M' ? 0.567*cintura + 0.101*idade - 31.8 : 0.439*cintura + 0.221*idade - 9.4;
    case 'TH7':
      D = sexo==='M' ? 1.1012 - 0.00040*S - 0.00000267*S*S : 1.0783 - 0.000234*S;
      return (495/D) - 450;
    case 'TH3':
      D = sexo==='M' ? 1.1133 - 0.001187*S : 1.09715 - 0.000863*S;
      return (495/D) - 450;
    case 'WL':
      if (sexo==='M') return 0.31457*(vals[0]||0) - 0.10969*(vals[1]||0) + 10.8336;
      else return 0.11077*((vals[0]||0)+(vals[1]||0)+(vals[2]||0)) - 0.17666*(vals[3]||0) + 51.03301;
    default: return null;
  }
}

function calcIMC() {
  const p = parseFloat(document.getElementById('imc-peso')?.value)||0;
  const h = parseFloat(document.getElementById('imc-alt')?.value)||0;
  if (!p||!h) return;
  const imc = p / Math.pow(h/100, 2);
  document.getElementById('imc-res').style.display = 'block';
  document.getElementById('imc-val').textContent = imc.toFixed(1);
  const [cls,badge] = imcClass(imc);
  const el = document.getElementById('imc-cls');
  el.textContent = cls; el.className = 'badge ' + badge;
}
function imcClass(v) {
  if (v<18.5) return ['Abaixo do peso','badge-low'];
  if (v<25)   return ['Normal','badge-ok'];
  if (v<30)   return ['Sobrepeso','badge-warn'];
  if (v<35)   return ['Obesidade I','badge-danger'];
  if (v<40)   return ['Obesidade II','badge-danger'];
  return ['Obesidade III','badge-danger'];
}

function calcIAC() {
  const q = parseFloat(document.getElementById('iac-q')?.value)||0;
  const h = parseFloat(document.getElementById('iac-h')?.value)||0;
  const s = document.getElementById('iac-s')?.value;
  if (!q||!h||!s) return;
  const iac = (q / Math.pow(h/100, 1.5)) - 18;
  document.getElementById('iac-res').style.display = 'block';
  document.getElementById('iac-val').textContent = iac.toFixed(1) + '%';
  const [cls,badge] = iacClass(iac, s);
  const el = document.getElementById('iac-cls');
  el.textContent = cls; el.className = 'badge ' + badge;
}
function iacClass(v, s) {
  if (s==='M') {
    if (v<8)   return ['Muito Magro','badge-low'];
    if (v<=20) return ['Saudável','badge-ok'];
    if (v<=25) return ['Excesso de gordura','badge-warn'];
    return ['Obesidade','badge-danger'];
  } else {
    if (v<21)  return ['Muito Magra','badge-low'];
    if (v<=32) return ['Saudável','badge-ok'];
    if (v<=38) return ['Excesso de gordura','badge-warn'];
    return ['Obesidade','badge-danger'];
  }
}

function imcClassColor(v) {
  if (!v || v <= 0) return ['-', '#5a6a88'];
  if (v < 18.5) return ['Abaixo do Peso', '#3b82f6'];
  if (v < 25)   return ['Normal',         '#00d4b8'];
  if (v < 30)   return ['Sobrepeso',      '#f59e0b'];
  if (v < 35)   return ['Obesidade I',    '#f97316'];
  if (v < 40)   return ['Obesidade II',   '#ef4444'];
  return          ['Obesidade III',       '#dc2626'];
}

function calcRCQ() {
  const c = parseFloat(document.getElementById('rcq-c')?.value)||0;
  const q = parseFloat(document.getElementById('rcq-q')?.value)||0;
  const s = document.getElementById('rcq-s')?.value;
  const fx = document.getElementById('rcq-fx')?.value;
  if (!c||!q||!s) return;
  const rcq = c/q;
  document.getElementById('rcq-res').style.display = 'block';
  document.getElementById('rcq-val').textContent = rcq.toFixed(2);
  let cls = 'Baixo', badge = 'badge-ok';
  if (s && fx && RCQ_TABLE[s]?.[fx]) {
    const [m,h,vh] = RCQ_TABLE[s][fx];
    if (rcq > vh)    { cls='Muito Alto'; badge='badge-danger'; }
    else if (rcq > h){ cls='Alto';       badge='badge-warn'; }
    else if (rcq > m){ cls='Moderado';   badge='badge-warn'; }
    else             { cls='Baixo';      badge='badge-ok'; }
  }
  const el = document.getElementById('rcq-cls');
  el.textContent = cls; el.className = 'badge ' + badge;
}

function atualizarCamposCardio() {
  const proto = document.getElementById('cd-proto')?.value || 'cooper';
  ['cooper','harvard','milha','ymca'].forEach(p => {
    const el = document.getElementById(`cd-${p}-fields`);
    if (el) el.style.display = p===proto ? 'block' : 'none';
  });
}

function calcCardio() {
  const idade = parseInt(document.getElementById('cd-idade')?.value)||0;
  const sexo  = document.getElementById('cd-sexo')?.value;
  const proto = document.getElementById('cd-proto')?.value || 'cooper';
  const fcmax = idade > 0 ? 220 - idade : 0;
  const fcmaxBox = document.getElementById('cd-fcmax-box');
  if (fcmax > 0) {
    fcmaxBox.style.display = 'block';
    document.getElementById('cd-fcmax-val').textContent = fcmax + ' bpm';
  } else { fcmaxBox.style.display = 'none'; }

  let vo2 = null;
  if (proto === 'cooper') {
    const d = parseFloat(document.getElementById('cd-cooper-dist')?.value)||0;
    if (d>0) vo2 = (d - 504.9) / 44.73;
  } else if (proto === 'harvard') {
    const f1 = parseInt(document.getElementById('cd-harv-1')?.value)||0;
    const f2 = parseInt(document.getElementById('cd-harv-2')?.value)||0;
    const f3 = parseInt(document.getElementById('cd-harv-3')?.value)||0;
    if (f1&&f2&&f3) {
      const pfi = (18000) / (5.5*(f1+f2+f3));
      vo2 = pfi * 0.35; // approximate conversion
    }
  } else if (proto === 'milha') {
    const t  = parseFloat(document.getElementById('cd-milha-t')?.value)||0;
    const fc = parseInt(document.getElementById('cd-milha-fc')?.value)||0;
    const p  = parseFloat(document.getElementById('cd-milha-p')?.value)||0;
    const gen = sexo==='M'?1:0;
    if (t&&fc&&p&&sexo)
      vo2 = 132.853 - 0.0769*(p*2.20462) - 0.3877*idade + 6.315*gen - 3.2649*t - 0.1565*fc;
  } else if (proto === 'ymca') {
    const w  = parseFloat(document.getElementById('cd-ymca-w')?.value)||0;
    const fc = parseInt(document.getElementById('cd-ymca-fc')?.value)||0;
    if (w&&fc) vo2 = (w * 12 / 75) * (fcmax / fc);
  }

  if (vo2 === null || isNaN(vo2) || vo2 <= 0) return;
  vo2 = Math.max(10, Math.min(90, vo2));
  document.getElementById('cd-resultado').style.display = 'block';
  document.getElementById('cd-vo2-val').textContent = vo2.toFixed(1) + ' ml/kg/min';
  const [cls, badge] = vo2Class(vo2, sexo, idade);
  const clsEl = document.getElementById('cd-vo2-cls');
  clsEl.textContent = cls; clsEl.className = 'badge ' + badge;

  if (fcmax > 0) {
    const zones = [
      { l:'Z1 Recuperação',  pct:'50–60%', c:'#64748b', lo:.50, hi:.60 },
      { l:'Z2 Aeróbico Leve', pct:'60–70%', c:'#3b82f6', lo:.60, hi:.70 },
      { l:'Z3 Aeróbico Mod.', pct:'70–80%', c:'#22c55e', lo:.70, hi:.80 },
      { l:'Z4 Limiar',        pct:'80–85%', c:'#f59e0b', lo:.80, hi:.85 },
      { l:'Z5 Anaeróbico',    pct:'85–95%', c:'#ef4444', lo:.85, hi:.95 },
    ];
    document.getElementById('cd-zonas').innerHTML = zones.map(z => `
    <div class="zone-row">
      <div class="zone-color" style="background:${z.c}"></div>
      <span style="font-weight:700;width:160px;font-size:12px;color:var(--tx)">${z.l}</span>
      <span style="font-size:11px;color:var(--mt)">${z.pct}</span>
      <span style="margin-left:auto;font-weight:700;font-size:12px;color:var(--tx)">
        ${Math.round(fcmax*z.lo)} – ${Math.round(fcmax*z.hi)} bpm
      </span>
    </div>`).join('');
  }
}

const VO2_M = [
  [20,[31.5,35.5,42.6,46.5,52.5]],[30,[30.2,33.6,41.0,44.5,50.5]],
  [40,[28.7,32.3,39.0,43.8,48.1]],[50,[25.1,28.8,35.8,41.0,45.4]],[60,[20.5,26.1,32.3,36.5,44.3]],
];
const VO2_F = [
  [20,[23.6,29.0,37.0,41.1,47.0]],[30,[22.8,27.0,34.0,39.0,45.0]],
  [40,[21.0,24.5,31.5,35.7,41.0]],[50,[20.2,22.8,30.0,33.0,37.0]],[60,[17.5,20.2,27.1,31.5,35.8]],
];
function vo2Class(vo2, sexo, idade) {
  const table = sexo==='F' ? VO2_F : VO2_M;
  let row = table[0][1];
  for (const [minAge, cuts] of table) { if (idade >= minAge) row = cuts; }
  const labels = ['Muito Fraco','Fraco','Regular','Bom','Excelente','Superior'];
  const badges = ['badge-danger','badge-danger','badge-warn','badge-ok','badge-ok','badge-ok'];
  let idx = 5;
  for (let i=0;i<row.length;i++) { if (vo2 < row[i]) { idx=i; break; } }
  return [labels[idx], badges[idx]];
}

async function popularAlunos() {
  if (!db) return;
  const { data } = await db.from('alunos').select('id,nome').eq('status','ATIVO').order('nome');
  const sel = document.getElementById('ficha-aluno-id');
  if (sel && data) {
    data.forEach(a => { const o=document.createElement('option'); o.value=a.id; o.textContent=a.nome; sel.appendChild(o); });
  }
  const p = new URLSearchParams(location.search);
  if (p.get('aluno_id')) {
    sel.value = p.get('aluno_id');
    carregarFicha().then(() => {
      if (p.get('print') === '1') setTimeout(exportarPDF, 600);
    });
  }
}

async function carregarFicha() {
  const alunoId = document.getElementById('ficha-aluno-id').value;
  if (!alunoId || !db) return;
  const data = document.getElementById('ficha-data').value;
  let q = db.from('fichas_avaliacao').select('*').eq('aluno_id', alunoId).order('data',{ascending:false}).limit(1);
  if (data) q = db.from('fichas_avaliacao').select('*').eq('aluno_id',alunoId).eq('data',data);
  const { data: rows } = await q;
  if (rows && rows.length > 0) {
    fichaId = rows[0].id;
    document.getElementById('ficha-data').value = rows[0].data;
    preencherFicha(rows[0].dados || {});
  } else {
    fichaId = null;
    dadosFicha = {};
  }
}

function preencherFicha(d) {
  dadosFicha = d;
  const set = (id, v) => { const e=document.getElementById(id); if(e&&v!=null){ if(e.tagName==='SELECT'||e.tagName==='TEXTAREA'||e.tagName==='INPUT') e.value=v; } };
  // Anamnese
  ['an-objetivos','an-pratica','an-pratica-desc','an-nutri','an-sono','an-medicamento','an-cirurgia','an-restricao','an-doenca']
    .forEach(id => set(id, d[id]));
  // PAR-Q
  if (d.parq) d.parq.forEach((item,i) => {
    const r = document.querySelector(`input[name="parq-${i}"][value="${item.resposta}"]`);
    if (r) { r.checked=true; parqToggle(i); }
    set(`parq-txt-${i}`, item.obs);
  });
  // Medidas
  ['med-pescoco','med-ombro','med-tor-rd','med-tor-re','med-tor-id','med-tor-ie',
   'med-braco-d','med-braco-e','med-cintura','med-abdomen','med-quadril',
   'med-coxa-d','med-coxa-e','med-pant-d','med-pant-e']
    .forEach(id => set(id, d[id]));
  svUpdate();
  // Composição
  set('cc-sexo',d['cc-sexo']); set('cc-idade',d['cc-idade']); set('cc-protocolo',d['cc-protocolo']); set('cc-peso',d['cc-peso']);
  if (d['cc-protocolo']) atualizarCamposDobras();
  if (d.dobras) Object.entries(d.dobras).forEach(([k,v]) => set(`db-${k}`,v));
  // Bio
  ['bio-peso','bio-imc','bio-gordura-pct','bio-gordura-kg','bio-massa-magra','bio-massa-muscular',
   'bio-massa-ossea','bio-visceral','bio-agua','bio-tmb','bio-idade-met']
    .forEach(id => set(id, d[id]));
  // IMC/IAC
  ['imc-peso','imc-alt','iac-q','iac-h','iac-s'].forEach(id => set(id, d[id]));
  calcIMC(); calcIAC();
  // RCQ
  ['rcq-s','rcq-fx','rcq-c','rcq-q','rcq-prof','rcq-obs'].forEach(id => set(id, d[id]));
  calcRCQ();
  // Postural
  ['post-cabeca','post-ombros','post-cervical','post-toracica','post-lombar','post-pelve','post-joelhos','post-pes','post-obs']
    .forEach(id => set(id, d[id]));
  // Cardio
  ['cd-fc-rep','cd-pa','cd-idade','cd-sexo','cd-proto','cd-cooper-dist','cd-harv-1','cd-harv-2','cd-harv-3','cd-milha-t','cd-milha-fc','cd-milha-p','cd-ymca-w','cd-ymca-fc']
    .forEach(id => set(id, d[id]));
  atualizarCamposCardio(); calcCardio();
  // Resultado visual
  setTimeout(renderResultado, 50);
}

    'med-abdomen':g('med-abdomen'),'med-quadril':g('med-quadril'),'med-coxa-d':g('med-coxa-d'),
    'med-coxa-e':g('med-coxa-e'),'med-pant-d':g('med-pant-d'),'med-pant-e':g('med-pant-e'),
    'cc-sexo':g('cc-sexo'),'cc-idade':g('cc-idade'),'cc-protocolo':g('cc-protocolo'),

    'bio-gordura-kg':g('bio-gordura-kg'),'bio-massa-magra':g('bio-massa-magra'),
    'bio-massa-muscular':g('bio-massa-muscular'),'bio-massa-ossea':g('bio-massa-ossea'),
    'bio-visceral':g('bio-visceral'),'bio-agua':g('bio-agua'),'bio-tmb':g('bio-tmb'),

    'cd-fc-rep':g('cd-fc-rep'),'cd-pa':g('cd-pa'),'cd-idade':g('cd-idade'),'cd-sexo':g('cd-sexo'),

}

async function salvarFicha() {
  const alunoId = document.getElementById('ficha-aluno-id').value;
  const data    = document.getElementById('ficha-data').value;
  if (!alunoId) { toast('Selecione um aluno.','err'); return; }
  if (!data)    { toast('Informe a data.','err'); return; }
  const [ano,mes,dia] = data.split('-').map(Number);
  const dt = new Date(ano,mes-1,dia);
  if (dt.getDate()!==dia||dt.getMonth()!==mes-1) { toast('Data inválida.','err'); return; }
  const btn = document.getElementById('btn-sv-ficha');
  btn.textContent = 'Salvando...'; btn.disabled = true;
  const rawDados = coletarDados();
  const dados = Object.fromEntries(
    Object.entries(rawDados).filter(([k, v]) => {
      if (k === 'parq') return true;
      if (k === 'dobras') return v && Object.keys(v).length > 0;
      return v !== null && v !== undefined && v !== '';
    })
  );
  const payload = { aluno_id:alunoId, data, dados };
  try {
    let err;
    if (fichaId) ({ error:err } = await db.from('fichas_avaliacao').update(payload).eq('id',fichaId));
    else {
      const { data:row, error:e } = await db.from('fichas_avaliacao').insert(payload).select().single();
      err = e; if (row) fichaId = row.id;
    }
    if (err) throw err;
    toast(fichaId ? 'Ficha atualizada!' : 'Ficha salva!','ok');
  } catch(e) { console.error(e); toast('Erro ao salvar: '+e.message,'err'); }
  finally { btn.innerHTML='<i data-lucide="save" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:5px"></i>Salvar Ficha'; btn.disabled=false; if(window.lucide) lucide.createIcons(); }
}

function exportarPDF() {
  const alunoEl = document.getElementById('ficha-aluno-id');
  const alunoNome = alunoEl?.options[alunoEl?.selectedIndex]?.text || 'Aluno';
  const data = document.getElementById('ficha-data')?.value || '';
  const dataFmt = data ? new Date(data + 'T00:00:00').toLocaleDateString('pt-BR') : '';
  document.title = `Ficha - ${alunoNome}${dataFmt ? ' - ' + dataFmt : ''}`;
  renderResultado();
  mudarAba(9);
  setTimeout(() => {
    window.print();
    setTimeout(() => { document.title = 'Ficha de Avaliação | Studio Focus'; }, 600);
  }, 200);
}

function toast(msg, tipo='ok') {
  const el = document.getElementById('toast-f');
  el.textContent = msg;
  el.style.background = tipo==='ok' ? 'var(--pu)' : '#ef4444';
  el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(16px)'; }, 3000);
}
